<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>セブ ジプニー路線ガイド</title>
<style>
:root{--bg:#f2f6f5;--ink:#0b2a33;--sub:#4c6670;--card:#fff;--line:#cbd9d6;--main:#0b5563;--maininv:#fff;--sig:#ffc933;--sigink:#3a2a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a1f;--ink:#e6f2f0;--sub:#9db5b8;--card:#12272d;--line:#27434b;--main:#5cc3d4;--maininv:#06242a}}
:root[data-theme="dark"]{--bg:#0b1a1f;--ink:#e6f2f0;--sub:#9db5b8;--card:#12272d;--line:#27434b;--main:#5cc3d4;--maininv:#06242a}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:640px;margin:0 auto;padding:14px 14px 60px}
h1{font-size:20px;margin:0}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}
.btn{min-height:48px;padding:0 16px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-weight:600}
.btn.pri{background:var(--main);color:var(--maininv);border-color:var(--main)}
.btn.warn{color:#c0392b}
.btn.block{width:100%}
input[type=text],input[type=search],textarea{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:16px}
textarea{min-height:120px}
:focus-visible{outline:3px solid var(--main);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{min-height:44px;padding:0 14px;border-radius:22px;background:var(--card);border:1.5px solid var(--line)}
.chip.on{background:var(--main);color:var(--maininv);border-color:var(--main);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.jp{min-height:76px;border-radius:14px;background:var(--sig);color:var(--sigink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;border-bottom:5px solid rgba(0,0,0,.25)}
.jp b{font-size:28px;line-height:1.1;letter-spacing:.02em}
.jp small{font-size:12px;opacity:.85;text-align:center;line-height:1.2;margin-top:2px}
.jp.un{background:repeating-linear-gradient(135deg,var(--sig) 0 12px,#ffdf7a 12px 24px)}
.count{color:var(--sub);font-size:14px;margin:6px 2px 10px}
.empty{padding:28px 12px;text-align:center;color:var(--sub);border:1.5px dashed var(--line);border-radius:14px}
.top{display:flex;align-items:center;gap:12px;margin:6px 0 4px}
.code{font-size:44px;font-weight:800;background:var(--sig);color:var(--sigink);padding:0 16px;border-radius:14px;line-height:1.3}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:#ffe9a8;color:#5a4300;margin-left:6px}
.sub{color:var(--sub);font-size:14px}
.stops{list-style:none;margin:16px 0;padding:0}
.stops li{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding-left:34px;border-bottom:1px solid var(--line)}
.stops li::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:4px;background:var(--main)}
.stops li:first-child::before{top:50%}
.stops li:last-child::before{bottom:50%}
.stops li::after{content:"";position:absolute;left:5px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--card);border:4px solid var(--main)}
.stops a{color:var(--main);font-weight:600;text-decoration:none;min-width:64px;min-height:44px;display:flex;align-items:center;justify-content:flex-end}
.note{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;margin:12px 0;white-space:pre-wrap}
label{display:block;font-weight:700;margin:16px 0 6px}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.row .btn{flex:1}
.hint{font-size:13px;color:var(--sub);margin:4px 0}
.fbox{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:4px 14px 14px;margin:16px 0}
.fbox select{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:16px;padding:0 10px}
.fbox input[type=text]{background:var(--bg)}
.trip{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.map{width:100%;height:auto;background:var(--card);border:1.5px solid var(--line);border-radius:12px;margin:8px 0}
</style>

  var P=pts(r),fac=(r.line&&r.line.length>1)?1:1.3,km=null,note='',f='',t='',pinfo='';
  var lg=legs(r),LG=$('fc-leg')?$('fc-leg').value:'';if(lg&&LG==='O')P=lg.out;else if(lg&&LG==='B')P=lg.back;
  var man=parseFloat($('fc-km').value);
  if(isFinite(man)&&man>0){km=man;note='入力した距離';f='距離を直接入力'}
  else if(P.length>1){
    var a=endPt(r,'fc-from','fc-from-t'),b=endPt(r,'fc-to','fc-to-t');
    if(a&&b){var sa=snap(P,a.p),sb=snap(P,b.p);km=Math.abs(sb.s-sa.s)*fac;f=a.n;t=b.n;note='路線上の距離'+(fac>1?'・停留所間の直線×1.3の目安':'')+(lg?(LG==='O'?'・往路のみ':LG==='B'?'・復路のみ':'・全線'):'');if(Math.max(sa.off,sb.off)>0.3)note+=' ※路線から300m以上離れた地点があります';pinfo=pi(a,sa,'乗る')+pi(b,sb,'降りる')}
  }
  if(km==null&&P.length<2){var a2=endPt(r,'fc-from','fc-from-t'),b2=endPt(r,'fc-to','fc-to-t');if(a2&&b2){km=hav(a2.p,b2.p)*1.3;f=a2.n;t=b2.n;note='この路線は線のデータがないため、2点間の直線距離×1.3の目安'}}
  var T=$('fc-type').value==='M'?{b:17,k:2.4}:{b:14,k:2},h='',cmp='';
  var bad=($('fc-from-t').value.trim()&&!parseLL($('fc-from-t').value))||($('fc-to-t').value.trim()&&!parseLL($('fc-to-t').value));
  if(km==null){lastCalc=null;h='<span class="sub">'+(bad?badMsg():'乗る位置と降りる場所、または距離(km)を入力してください')+'</span>'}
  else{
    var c=Math.round(T.b+Math.max(0,km-4)*T.k);
    lastCalc={km:km,calc:c,f:f,t:t};
    h='距離 約'+km.toFixed(1)+'km <span class="sub">('+esc(note)+')</span><br>参考運賃 <b style="font-size:28px">₱'+c+'</b> <span class="sub">(実際と異なる場合が多々あります)</span>'+(pinfo?'<br><span class="sub">'+pinfo+'</span>':'')+(bad?'<br><span class="sub">※貼り付けた内容は読み取れませんでした(短縮リンクは不可)。選択した地点で計算しています</span>':'');
    var rf=parseFloat(r.fare);
    if(isFinite(rf))h+='<br>登録運賃 ₱'+rf+' / 参考運賃との差 '+sg(rf-c);
    var act=parseFloat($('fc-act').value);
    if(isFinite(act))cmp='実際 ₱'+act+' / 参考運賃との差 '+sg(act-c)+'ペソ'+(act===c?'(一致)':act>c?'(実際のほうが高い)':'(実際のほうが安い)');
  }
  el.innerHTML=h;$('fare-cmp').textContent=cmp;
}
function fareV(r){
  var opts='<option value="">地点を選ぶ</option>'+(r.stops||[]).map(function(s,i){return s.ll?'<option value="'+i+'">'+esc(s.n)+'</option>':''}).join('')+((r.line&&r.line.length>1)?'<option value="LS">路線の始点</option><option value="LM">折返し点(始点から最も遠い点)</option><option value="LE">路線の終点(線の最後)</option>':'');
  var lg=legs(r),legsel=lg?'<label>往復をつないだ線です。どの区間に乗りますか</label><select id="fc-leg" class="fc"><option value="O">往路(始点→折返し点)</option><option value="B">復路(折返し点→終点)</option><option value="">全線(折返しをまたいで乗る)</option></select>':'';
  var rows='';
  (r.trips||[]).forEach(function(t,i){rows='<div class="trip"><span>'+esc(t.f)+(t.t?' → '+esc(t.t):'')+'<br><small class="sub">'+t.km+'km・'+(t.y==='M'?'モダン':'伝統')+'・計算₱'+t.c+' / 実際₱'+t.a+'('+sg(t.a-t.c)+')</small></span><button class="btn" data-trip-del="'+i+'">削除</button></div>'+rows});
  return '<div class="fbox"><h2 style="font-size:18px;margin:14px 0 0">運賃を調べる</h2>'
  +''+legsel+'<label>乗る位置</label><select id="fc-from" class="fc">'+opts+'</select><input type="text" id="fc-from-t" class="fc" placeholder="または座標・GoogleマップのURLを貼り付け" style="margin-top:8px"><button class="btn block" data-act="gps-from" style="margin-top:8px">現在地を使う</button>'
  +'<label>降りる場所</label><select id="fc-to" class="fc">'+opts+'</select><input type="text" id="fc-to-t" class="fc" placeholder="または座標・GoogleマップのURLを貼り付け" style="margin-top:8px"><button class="btn block" data-act="gps-to" style="margin-top:8px">現在地を使う</button>'
  +'<p class="hint">Googleマップで地点を長押し(PCは右クリック)すると座標(例 10.3187, 123.9050)が出ます。コピーして上の欄に貼り付けてください。度分秒表記や、アドレスバーの長いURLも使えます。「共有」の短いリンク(maps.app.goo.gl)は読み取れません。 <a href="https://www.google.com/maps" target="_blank" rel="noopener" style="color:var(--main)">Googleマップを開く</a></p>'
  +'<label>車両の種類</label><select id="fc-type" class="fc"><option value="T">伝統型(₱14 + 4km超は1kmごと₱2)</option><option value="M">モダン型(₱17 + 4km超は1kmごと₱2.40)</option></select>'
  +'<label>距離を直接入力(任意・km)</label><input type="text" id="fc-km" class="fc" inputmode="decimal" placeholder="Googleマップで出た距離など">'
  +'<div class="note" id="fare-out"><span class="sub">乗る位置と降りる場所、または距離(km)を入力してください</span></div>'
  +'<label>実際に払った運賃(ペソ)</label><input type="text" id="fc-act" class="fc" inputmode="decimal" placeholder="例: 17"><p class="hint" id="fare-cmp"></p>'
  +'<div class="row"><button class="btn pri" data-act="fare-save">この結果を記録</button></div>'+rows
  +'<p class="hint">2026年9月28日改定の運賃(4kmまで・以降は1kmごと)を使った目安です。実際の運賃と違う場合は、記録して比べてください。</p></div>';
}
function addGps(){
  if(!navigator.geolocation){alert('この端末では現在地を取得できません');return}
  var nm=prompt('この場所の名前(停留所名・目印など)');if(nm===null)return;
  navigator.geolocation.getCurrentPosition(function(p){
    var ta=$('f-stops');if(!ta)return;
    var line=(nm.trim()||'地点')+' | '+p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6);
    ta.value=(ta.value.trim()?ta.value.replace(/\s+$/,'')+'\n':'')+line;
  },function(){alert('現在地を取得できませんでした(この画面では許可されていない場合があります)。Googleマップで長押しした座標を貼り付けて追加してください')},{enableHighAccuracy:true,timeout:15000});
}
function saveTrip(){
  var r=find(view.id),c=lastCalc,act=parseFloat($('fc-act').value);
  if(!c||!isFinite(act)){alert('距離(または乗る位置と降りる場所)と、実際の運賃の両方を入力してください');return}
  (r.trips=r.trips||[]).push({f:c.f,t:c.t,km:+c.km.toFixed(1),c:c.calc,a:act,y:$('fc-type').value});
  save();go({t:'detail',id:r.id});
}
function fcGps(id){
  if(!navigator.geolocation){alert('この端末では現在地を取得できません。座標を貼り付けてください');return}
  navigator.geolocation.getCurrentPosition(function(p){
    var el=$(id);if(!el)return;
    el.value=p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6);
    calcFare();
  },function(){alert('現在地を取得できませんでした(この画面では許可されていない場合があります)。Googleマップで長押しした座標を貼り付けてください')},{enableHighAccuracy:true,timeout:15000});
}
function onFc(e){
  var t=e.target;
  if(t.id==='fc-from'&&t.value!=='')$('fc-from-t').value='';
  if(t.id==='fc-to'&&t.value!=='')$('fc-to-t').value='';
  if(t.classList&&t.classList.contains('fc'))calcFare()
}
function ptNameOnly(l){if(l.split('|').length>1)return false;var q=parseLL(l);return !(q&&(/^https?:/i.test(l)||LL.test(l)))}
function ptLines(t){return t.split('\n').map(function(l){return l.trim()}).filter(Boolean)}
function ptOpts(t){var L=ptLines(t),a='',b='';L.forEach(function(l,i){var n=l.split('|')[0].trim();if(ptNameOnly(l))a+='<option value="a'+i+'">'+esc(n)+'</option>';b+='<option value="i'+i+'">'+esc(n)+'</option>'});return '<option value="">末尾に新しい停留所として追加</option>'+(a?'<optgroup label="名前だけの停留所に座標を付ける">'+a+'</optgroup>':'')+(b?'<optgroup label="この停留所の後ろに挿入">'+b+'</optgroup>':'')}
function addPt(){
  var ta=$('f-stops'),msg=$('pt-msg'),txt=$('pt-in').value;
  if(!ta||!msg)return;
  if(/maps\.app\.goo\.gl|goo\.gl\/maps/i.test(txt)){msg.textContent='Googleマップの短縮リンクは読み取れません。地点を長押し(PCは右クリック)して出る座標を貼り付けるか、アドレスバーの長いURLを貼り付けてください';return}
  var q=parseLL(txt);
  if(!q){msg.textContent='座標を読み取れませんでした。座標(例 10.3187, 123.9050)、Googleマップの長いURL、度分秒のいずれかを貼り付けてください';return}
  var c=q[1].toFixed(6)+','+q[0].toFixed(6),L=ptLines(ta.value),tg=$('pt-tg').value,nm=$('pt-name').value.replace(/\|/g,' ').trim(),i;
  if(tg.charAt(0)==='a'){i=+tg.slice(1);L[i]=L[i]+' | '+c}
  else if(tg.charAt(0)==='i'){i=+tg.slice(1);L.splice(i+1,0,(nm||'地点')+' | '+c)}
  else L.push((nm||'地点')+' | '+c);
  ta.value=L.join('\n');$('pt-tg').innerHTML=ptOpts(ta.value);$('pt-in').value='';$('pt-name').value='';
  msg.innerHTML='追加しました('+c+')。最後に下の「保存」を押すと確定します。 <a target="_blank" rel="noopener" href="https://www.google.com/maps?q='+q[1]+','+q[0]+'">地図で確認</a>';
}
document.addEventListener('input',function(e){if(e.target.id==='f-stops'&&$('pt-tg'))$('pt-tg').innerHTML=ptOpts(e.target.value)});
document.addEventListener('input',onFc);
document.addEventListener('change',onFc);
render();
</script>
